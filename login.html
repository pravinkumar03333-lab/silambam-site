<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="login-page">


<div class="login-container">

    <div class="login-box">

        <div class="login-logo">
            SILAMBAM
        </div>

        <h1>Admin Login</h1>

        <p>
            Silambam Class Management System
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                LOGIN
            </button>

        </form>


        <a href="/" class="back-home">
            Back to Home
        </a>

    </div>

</div>


</body>

</html>
